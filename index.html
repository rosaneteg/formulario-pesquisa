<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- VAmos começar criando uma classe de estilo chamada container-->
    <main class="container">
        <h1>Pesquisa de Satisfação</h1>

        <p class="subtitulo">Leva menos de 2 minutos. Campos com * são de preenchimento obrigatório.</p>

        <form id="formPesquisa" action="processar.php" method="post" novalidate>
            <!-- Nome -->
            <div class="campo" data-campo="nome">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                <span class="erro" id="erro-nome" aria-live="polite"></span>
            </div>

            <!-- E-mail -->
            <div class="campo" data-campo="email">
                <label for="email">E-mail *</label>    
                <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                <span class="erro" id="erro-email" aria-live="polite"></span>
            </div> 

            <!-- Idade -->
            <div class="campo" data-campo="idade">
                <label for="idade">Idade *</label>    
                <input type="number" id="idade" name="emaidadel" placeholder="Ex.: 25">
                <span class="erro" id="erro-idade" aria-live="polite"></span>
            </div>  

            <!-- Estado -->
            <div class="campo" data-campo="estado">
                <label for="estado">Estado *</label>    
                <select id="estado" name="estado">
                    <option value="">Selecione o Estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="PR">PR</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RJ">Rio de Janeiro</option>
                    
                </select>
                <span class="erro" id="erro-estado" aria-live="polite"></span>
            </div>

            <!-- Nota da avaliação (radio) -->
            <fieldset class="campo" data-campo="nota">
                <legend>Qual nota você dá para o curso? *</legend>
                <div class="opcoes-nota">
                    <label>
                        <input type="radio" name="nota" value="1">
                        <span>1</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="2">
                        <span>2</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="3">
                        <span>3</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="4">
                        <span>4</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="5">
                        <span>5</span>
                    </label>
                </div>
                <span class="erro" id="erro-nota" aria-live="polite"></span>
            </fieldset>

            <!-- Como Conheceu (checkbox)-->
            <fieldset class="campo" data-campo="origem">
                <legend>Como você conheceu o curso? *(marque pelo menos um)</legend>
                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="indicacao">
                    Indicação de amigos
                </label>
                
                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="redes">
                    Redes Sociais
                </label>

                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="busca">
                    Pesquisa na Internet
                </label>

                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="outro">
                    Outro
                </label>
                <span class="erro" id="erro-origem" aria-live="polite"></span>
            </fieldset>

            <!-- Comentário -->
            <div class="campo" data-campo="comentario">
                <label for="comentario">Comentário (opcional)</label>
                <textarea id="comentario" name="comentario" rows="4" maxlength="300" placeholder="Conte o que você achou"></textarea>
                <small class="contador">
                    <span id="contador">0</span>
                    /300 caracteres
                </small>
                <span class="erro" id="erro-comentario" aria-live="polite"></span>
            </div>

            <!-- Campo de aceite de termos -->
            <div class="campo" data-campo="termos">
                <label class="opcao">
                    <input type="checkbox" id="termos" name="termos">
                    Concordo em enviar minhas respostas *
                </label>    
                <span class="erro" id="erro-termos" aria-live="polite"></span>
            </div>

            <!-- Botão de envio -->
            <button type="submit" class="botao">
                Enviar Pesquisa    
            </button> 
        </form>

    </main>

    <!-- Aqui vamos vincular o nosso arquivo javascript
     Deve ser a última coisa antes de fechar a tag <body> -->
    <!-- <script src="script.js"></script> -->
</body>

</html>
